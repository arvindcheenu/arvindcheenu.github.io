projects:
  - name: heed
    kind: library
    year: 2026
    summary: Attention recording for any web page. Cursor dwell, viewport visibility and webcam gaze with calibration, scanpaths, attention-triggered experience sampling and on-device LLM summaries, behind one declarative spec.
    tech: [JavaScript, MediaPipe, WebLLM]
    links:
      web: https://heed.arvindchee.nu
      code: https://github.com/arvindcheenu/heed
  - name: Elicitation Lab
    kind: tool
    summary: Compiles a client persona into an offline requirements-elicitation simulator, with Claude, Chrome's built-in model, WebLLM or Ollama doing the compiling.
    tech: [JavaScript, WebLLM, Ollama]
    links:
      web: https://arvindchee.nu/elicitation-lab/
      code: https://github.com/arvindcheenu/elicitation-lab
  - name: SciFig
    kind: tool
    summary: Browser generator for CHI-style teaser and multi-panel figures. Layout presets, drag-in panels, annotation, export at 300–600 dpi.
    tech: [React, TypeScript, Vite]
    links:
      web: https://scifig.arvindchee.nu
      code: https://github.com/arvindcheenu/scifig
  - name: habitat.css
    kind: library
    summary: Ambient-adapting CSS. E-ink and camouflage display modes driven by measured room light and colour.
    tech: [CSS, JavaScript]
    links:
      web: https://arvindchee.nu/habitat.css/
      code: https://github.com/arvindcheenu/habitat.css
  - name: Matercolors
    kind: library
    summary: Tiny, zero-dependency library that builds harmonious Material palettes from any colour.
    tech: [JavaScript, npm]
    links:
      web: https://www.npmjs.com/package/matercolors
      code: https://github.com/arvindcheenu/matercolors
  - name: Chromanomer
    kind: library
    summary: Perceptually intuitive colour naming on the LCh colour space, for accessible colour selection with almost no learning curve.
    tech: [JavaScript, npm]
    links:
      web: https://arvindcheenu.github.io/Chromanomer/
      code: https://github.com/arvindcheenu/chromanomer
