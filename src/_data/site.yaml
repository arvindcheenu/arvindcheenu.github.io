# Shown under the Publications heading, after Niklas Elmqvist's CV.
publications_note: >-
  In all publications, my name is in bold, and authors who contributed equally are
  marked with a dagger (†). I follow the convention where the first author is the
  lead author, and the last author is often the most senior author with a supervisory
  role in the project. My primary area of publication is computer science, where
  conference papers are often counted as having equal or higher prominence to journal
  publications. These conference papers are strictly peer-reviewed with at least three
  external reviewers and typically have acceptance rates of 30% or lower. Acceptance
  rates are given for all conference papers (if known); these are specific to each
  year. IEEE VIS is the leading international conference on visualization, and its
  full papers appear in IEEE TVCG. ACM CHI is the leading international conference on
  human-computer interaction. ACM Creativity & Cognition is the ACM conference on
  creativity research and the tools that support it. ETVIS is the visualization
  workshop of ACM ETRA, the main conference on eye-tracking research. For citations
  and other metrics, please refer to my
  [Google Scholar](https://scholar.google.com/citations?user=lVhsLEMAAAAJ).

