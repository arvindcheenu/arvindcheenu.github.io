# ─────────────────────────────────────────────────────────────────────────────
#  arvindchee.nu — every word on the page lives in this file.
#
#  Editing rules of thumb
#  • Text fields accept inline Markdown: **bold**, *italic*, [link](https://…).
#  • `image:` is optional on news, publications and projects. Put the file in
#    src/assets/ and write `image: assets/name.webp`. Leave it out for none.
#    Keep images small: about 640 px wide, WebP, under 80 KB.
#  • `images:` (a list) shows a strip of pictures that open full size, as on the
#    Attention-Aware Visualization publication below. Keep each under 1200 px.
#  • Dates are YYYY-MM (or YYYY). Use `end: present` for ongoing roles.
#  • Empty values are skipped, so a half-filled entry never shows "[todo]".
#  • A field written as { research: …, industry: … } shows the matching text
#    for whichever way the page is tailored (the Research / Industry switch).
#  • Link to another entry on the page with [text](#id) or `ref: id`. Only an
#    entry's own page leads outside: a talk links to its paper here, the paper
#    links to its DOI. Publication ids are their `id`; others are set with
#    `id:` or made from the name, e.g. project-heed, ta-datavis, award-<paper id>.
# ─────────────────────────────────────────────────────────────────────────────

