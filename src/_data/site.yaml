# ── Introduction ────────────────────────────────────────────────────────────
role: PhD candidate in visualization and HCI, Aarhus University
status: Open to postdoc and research roles from January 2027
ring: "Open to work · From January 2027 · "   # text spinning round the portrait
bio:
  - I build systems that record where people look and show it back to them, their collaborators and the people who read their work later.
  - "My PhD at the Center for Anytime Anywhere Analytics (CA³), [Aarhus University](https://cs.au.dk), with [Niklas Elmqvist](https://cs.au.dk/~elm/), develops *attention-aware analytics*, systems that capture, record and revisualize where people look for four readers, each further from the moment it happened: the analyst during their own task, collaborators sharing a mixed-reality space, an observer reviewing the session afterwards, and a stranger who only receives the findings. I build these systems myself for the web, Meta Quest 3 and HoloLens 2."
  - Before Aarhus I did a master's in HCI at the University of Maryland with Joel Chan, building creativity support tools for analogical reasoning and running early studies of LLMs as analogy generators. Next, I want attention to become a first-class signal in data work that people share with AI agents.

# Third-person biographies for talk introductions, programmes and applications.
# Each has a Copy button on the page. Separate paragraphs with a blank line.
biography:
  short: >-
    Arvind Srinivasan is a PhD candidate at the Center for Anytime Anywhere Analytics,
    Aarhus University, advised by Niklas Elmqvist. He builds systems that capture,
    record and revisualize where people look, from a single analyst at a dashboard to
    collaborators sharing a mixed-reality space. His work appears in IEEE TVCG and at
    IEEE VIS and ACM Creativity & Cognition, where two of his papers received Best
    Paper Honorable Mentions.
  long: |
    Arvind Srinivasan is a PhD candidate in Computer Science at Aarhus University. He
    joined the Center for Anytime Anywhere Analytics (CA³) as one of its first hires and
    is advised by Niklas Elmqvist. His research develops attention-aware analytics,
    systems that capture where people look during analysis, record it, and show it back
    to a reader. His thesis follows that record outward from the person who produced it,
    to collaborators sharing a mixed-reality space, to an observer reviewing a session
    afterwards, and to a stranger who receives only the findings. He builds these systems
    himself for the web, Meta Quest 3 and HoloLens 2, and has published them in IEEE TVCG
    and at workshops of ACM CHI and ACM ETRA. From October 2025 to February 2026 he was a
    visiting researcher at VISUS, University of Stuttgart, with Michael Sedlmair, studying
    gaze in band rehearsals with mobile eye tracking.

    Before Aarhus, he earned an MS in Human-Computer Interaction at the University of
    Maryland, where he worked with Joel Chan on creativity support tools for analogical
    reasoning and on early studies of large language models as analogy generators. That
    work received Best Paper Honorable Mentions at ACM Creativity & Cognition in 2023 and
    2024. He holds a BTech in Computer Science and Engineering from SRM Institute of
    Science and Technology, and worked as a user experience intern at Tetrate. He
    maintains open-source tools including heed, Elicitation Lab, SciFig and Matercolors,
    and teaches on the Data Visualization course at Aarhus University.

