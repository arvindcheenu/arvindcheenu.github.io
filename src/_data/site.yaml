# ── Introduction ────────────────────────────────────────────────────────────
role: PhD candidate in visualization and HCI
affiliation: Center for Anytime Anywhere Analytics, Aarhus University
ring: "Open to work · From January 2027 · "   # text spinning round the portrait
bio:
  research:
    - I build systems that record where people look and show it back to them, their collaborators and the people who read their work later.
    - "My PhD at the Center for Anytime Anywhere Analytics (CA³), [Aarhus University](https://cs.au.dk), with [Niklas Elmqvist](https://cs.au.dk/~elm/), develops *attention-aware analytics*, systems that capture, record and revisualize where people look for four readers, each further from the moment it happened: the analyst during their own task, collaborators sharing a mixed-reality space, an observer reviewing the session afterwards, and a stranger who only receives the findings. I build these systems myself for the web, Meta Quest 3 and HoloLens 2."
    - Before Aarhus I did a master's in HCI at the University of Maryland with Joel Chan, building creativity support tools for analogical reasoning and running early studies of LLMs as analogy generators. Next, I want attention to become a first-class signal in data work that people share with AI agents.
  industry:
    - I build analytics interfaces that track where people look and put that record to use, for the person at the screen, for collaborators in the same mixed-reality space, and for whoever picks up the analysis next.
    - "At the Center for Anytime Anywhere Analytics, Aarhus University, I write these systems end to end for the web, Meta Quest 3 and HoloLens 2: gaze capture, per-mark visibility tracking, event-logged back ends and the views that replay them. I run the user studies that test them, and I maintain [heed](#project-heed), an open-source toolkit that records attention on any web page."
    - Before Aarhus I did a master's in HCI at the University of Maryland and worked as a UX intern at Tetrate, redesigning its core platform for a new brand identity. I work mostly in TypeScript, React, WebXR, Python and Unity.

