        visiting researcher at VISUS, University of Stuttgart, with Michael Sedlmair, studying
        gaze in band rehearsals with mobile eye tracking.

        Before Aarhus, he earned an MS in Human-Computer Interaction at the University of
        Maryland, where he worked with Joel Chan on creativity support tools for analogical
        reasoning and on early studies of large language models as analogy generators. That
        work received Best Paper Honorable Mentions at ACM Creativity & Cognition in 2023 and
        2024. He holds a BTech in Computer Science and Engineering from SRM Institute of
        Science and Technology, and worked as a user experience intern at Tetrate. He
        maintains open-source tools including heed, Elicitation Lab, SciFig and Matercolors,
        and is a teaching assistant on the Data Visualization course at Aarhus University.
